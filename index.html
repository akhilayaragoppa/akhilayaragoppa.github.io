<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akhila Yaragoppa</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --accent: #444444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --fg: #f2f2f2;
      --muted: #a3a3a3;
      --accent: #cccccc;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .wrap {
    max-width: 32rem;
  }
  h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 600;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }
  p.role {
    margin: 0 0 2rem;
    color: var(--muted);
    font-size: 1.05rem;
    font-weight: 400;
  }
  .status {
    display: inline-block;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--muted);
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Akhila Yaragoppa</h1>
    <p class="role">Lead Machine Learning Engineer</p>
    <span class="status">Site is a work in progress</span>
  </div>
</body>
</html>
